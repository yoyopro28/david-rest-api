<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imageboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute left-1/2 top-0 h-96 w-96 -translate-x-1/2 rounded-full bg-cyan-500/10 blur-3xl"></div>
        <div class="absolute bottom-0 right-0 h-80 w-80 rounded-full bg-fuchsia-500/10 blur-3xl"></div>
    </div>

    <main class="mx-auto w-full max-w-4xl px-4 py-8 sm:px-6 sm:py-12">
        <header class="mb-10 text-center">
            <img src="/Banner.svg" alt="Imageboard Banner"
                 class="mx-auto max-h-40 w-auto max-w-full rounded-2xl shadow-2xl shadow-cyan-950/40">
            <p class="mt-4 text-sm font-medium uppercase tracking-[0.3em] text-cyan-400">Community Imageboard</p>
        </header>

        <section class="mb-12 rounded-3xl border border-white/10 bg-white/[0.06] p-5 shadow-2xl shadow-black/20 backdrop-blur sm:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-bold tracking-tight text-white sm:text-3xl">Neuen Thread erstellen</h1>
                <p class="mt-2 text-sm text-slate-400">Teile einen Gedanken und optional ein Bild mit der Community.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="titleInput" class="mb-2 block text-sm font-medium text-slate-300">Titel</label>
                    <input type="text" id="titleInput" placeholder="Worum geht es?"
                           class="w-full rounded-xl border border-white/10 bg-slate-900/80 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-400 focus:ring-4 focus:ring-cyan-400/10">
                </div>

                <div>
                    <label for="textInput" class="mb-2 block text-sm font-medium text-slate-300">Beitrag</label>
                    <textarea id="textInput" rows="5" placeholder="Schreibe deinen Beitrag ..."
                              class="w-full resize-y rounded-xl border border-white/10 bg-slate-900/80 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-400 focus:ring-4 focus:ring-cyan-400/10"></textarea>
                </div>

                <div>
                    <label for="imageUrlInput" class="mb-2 block text-sm font-medium text-slate-300">Bild-URL <span class="font-normal text-slate-500">(optional)</span></label>
                    <input type="url" id="imageUrlInput" placeholder="https://example.com/bild.jpg"
                           class="w-full rounded-xl border border-white/10 bg-slate-900/80 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-400 focus:ring-4 focus:ring-cyan-400/10">
                </div>

                <button type="button" onclick="createThread()"
                        class="inline-flex w-full items-center justify-center rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 shadow-lg shadow-cyan-500/20 transition hover:bg-cyan-300 focus:outline-none focus:ring-4 focus:ring-cyan-400/30 active:scale-[0.99] sm:w-auto">
                    Thread veröffentlichen
                </button>
            </div>
        </section>

        <section>
            <div class="mb-6 flex items-end justify-between gap-4">
                <div>
                    <p class="text-sm font-semibold uppercase tracking-widest text-cyan-400">Aktuelle Beiträge</p>
                    <h2 class="mt-1 text-3xl font-bold tracking-tight text-white">Meine Threads</h2>
                </div>
                <button type="button" onclick="loadThreads()" class="rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white">
                    Aktualisieren
                </button>
            </div>

            <div id="threads-container" class="space-y-6">
                <div class="rounded-2xl border border-white/10 bg-white/5 p-6 text-center text-slate-400">Lädt ...</div>
            </div>
        </section>
    </main>

    <script>
        async function loadThreads() {
            const container = document.getElementById('threads-container');

            try {
                const response = await fetch('/threads');
                if (!response.ok) throw new Error('Threads konnten nicht geladen werden.');

                const threads = await response.json();
                container.innerHTML = '';

                if (threads.length === 0) {
                    container.innerHTML = '<div class="rounded-2xl border border-dashed border-white/15 bg-white/[0.03] p-10 text-center text-slate-400">Noch keine Threads vorhanden.</div>';
                    return;
                }

                threads.forEach(thread => {
                    const threadElement = document.createElement('article');
                    threadElement.className = 'overflow-hidden rounded-3xl border border-white/10 bg-white/[0.06] shadow-xl shadow-black/20 backdrop-blur';

                    let repliesHtml = '';
                    if (thread.replies && thread.replies.length > 0) {
                        repliesHtml = thread.replies.map(reply => `
                            <div class="rounded-xl border border-white/5 bg-slate-950/50 px-4 py-3 text-sm text-slate-300">
                                <span class="mr-2 text-cyan-400">↳</span>${reply.text}
                            </div>
                        `).join('');
                    } else {
                        repliesHtml = '<p class="text-sm text-slate-500">Noch keine Antworten.</p>';
                    }

                    threadElement.innerHTML = `
                        ${thread.imageUrl ? `
                            <div class="max-h-[32rem] overflow-hidden bg-slate-900">
                                <img src="${thread.imageUrl}" alt="${thread.title}" class="h-full max-h-[32rem] w-full object-contain" loading="lazy">
                            </div>
                        ` : ''}

                        <div class="p-5 sm:p-7">
                            <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
                                <h3 class="text-xl font-bold text-white sm:text-2xl">${thread.title}</h3>
                                <span class="rounded-full border border-cyan-400/20 bg-cyan-400/10 px-3 py-1 text-xs font-semibold text-cyan-300">#${thread.id}</span>
                            </div>
                            <p class="whitespace-pre-wrap leading-7 text-slate-300">${thread.text}</p>
                            <p class="mt-4 text-xs text-slate-500">${thread.createdAt || ''}</p>

                            <div class="mt-6 border-t border-white/10 pt-5">
                                <h4 class="mb-3 text-sm font-semibold uppercase tracking-wider text-slate-400">Antworten</h4>
                                <div class="mb-4 space-y-2">${repliesHtml}</div>
                                <div class="flex flex-col gap-2 sm:flex-row">
                                    <input type="text" id="replyInput-${thread.id}" placeholder="Antwort schreiben ..."
                                           class="min-w-0 flex-1 rounded-xl border border-white/10 bg-slate-950/70 px-4 py-2.5 text-sm text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-400 focus:ring-4 focus:ring-cyan-400/10">
                                    <button type="button" onclick="createReply(${thread.id})"
                                            class="rounded-xl bg-slate-100 px-5 py-2.5 text-sm font-bold text-slate-900 transition hover:bg-white active:scale-[0.98]">
                                        Antworten
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;

                    container.appendChild(threadElement);
                });
            } catch (error) {
                container.innerHTML = `<div class="rounded-2xl border border-red-400/20 bg-red-400/10 p-5 text-red-200">${error.message}</div>`;
            }
        }

        async function createThread() {
            const titleInput = document.getElementById('titleInput');
            const textInput = document.getElementById('textInput');
            const imageUrlInput = document.getElementById('imageUrlInput');
            const title = titleInput.value.trim();
            const text = textInput.value.trim();
            const imageUrl = imageUrlInput.value.trim();

            if (!title || !text) {
                alert('Bitte Titel und Text ausfüllen!');
                return;
            }

            const response = await fetch('/threads', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, text, imageUrl: imageUrl || null})
            });

            if (!response.ok) {
                alert('Der Thread konnte nicht erstellt werden.');
                return;
            }

            titleInput.value = '';
            textInput.value = '';
            imageUrlInput.value = '';
            loadThreads();
        }

        async function createReply(threadId) {
            const inputField = document.getElementById(`replyInput-${threadId}`);
            const text = inputField.value.trim();

            if (!text) {
                alert('Bitte eine Antwort eingeben!');
                return;
            }

            const response = await fetch(`/threads/${threadId}/replies`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });

            if (!response.ok) {
                alert('Die Antwort konnte nicht erstellt werden.');
                return;
            }

            inputField.value = '';
            loadThreads();
        }

        loadThreads();
    </script>
</body>
</html>
