<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset = "UTF-8">
        <title>Imageboard</title>
    </head>
    <body>
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="/Banner.svg" alt="Imageboard Banner" style="max-width: 100%; height: auto;">
        </div>

        <h1>Neuen Thread erstellen</h1>
        
        <div>
            <input type="text" id="titleInput" placeholder="Titel eingeben"><br><br>
            <textarea id="textInput" placeholder="Text eingeben"></textarea><br><br>
            <input type="url" id="imageUrlInput" placeholder="Bild-URL eingeben (optional)"><br><br>
            <button onclick = "createThread()">Thread abschicken</button>
        </div>

        <h1>Meine Threads</h1>

        <div id="threads-container">Lädt...</div>

        <script>
            async function loadThreads(){
                const response = await fetch('/threads');

                const threads = await response.json();

                const container = document.getElementById('threads-container');
                container.innerHTML = '';

                threads.forEach(thread => {
                    const threadElement = document.createElement('div');
                    let repliesHtml = '';
                    if(thread.replies && thread.replies.length > 0){
                        thread.replies.forEach(reply => {
                            repliesHtml += `<p style="margin-left: 20px; font-size: 0.9em;">💬 ${reply.text}</p>`;
                        })
                    }

                    threadElement.innerHTML = `
                    <h3>#${thread.id} - ${thread.title}<small style="font-size:0.6em; color:gray;"> <br> (${thread.createdAt || ''})</small></h3>
                    <p>${thread.text}</p>
                    ${thread.imageUrl
                        ? `<img src="${thread.imageUrl}" alt="${thread.title}" style="max-width: 500px; width: 100%; height: auto;">`
                        : ''}
                    
                    <!-- Bereich für Antworten -->
                    <div style ="background: #f0f0f0; padding: 10px; margin-top: 10px;">
                        <h4>Antworten</h4>
                        ${repliesHtml}

                        <input type="text" id="replyInput-${thread.id}" placeholder="Antwort schreiben...">
                        <button onclick="createReply(${thread.id})">Antworten</button>
                    </div>
                    <hr>
                `;
                container.appendChild(threadElement);
                })
            }

            async function createThread() {
                const title = document.getElementById('titleInput').value;
                const text = document.getElementById('textInput').value;
                const imageUrl = document.getElementById('imageUrlInput').value.trim();

                if(!title || !text) {
                    alert('Bitte Titel und Text ausfüllen!');
                    return;
                }

                await fetch('/threads', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        text: text,
                        imageUrl: imageUrl || null
                    })
                })

                document.getElementById('titleInput').value = '';
                document.getElementById('textInput').value = '';
                document.getElementById('imageUrlInput').value = '';

                loadThreads();

            }

            async function createReply(threadId){
                const inputField = document.getElementById(`replyInput-${threadId}`);
                const text = inputField.value;

                if(!text){
                    alert('Bitte eine Antwort eingeben!');
                    return;
                }

                await fetch(`/threads/${threadId}/replies`, {
                    method: 'POST',
                    headers:{
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text
                    })
                });

                inputField.value = '';
                loadThreads();
            }

            loadThreads();
        </script>
    </body>
</html>
